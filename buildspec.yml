version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running application tests..."
      - python -m pytest --junitxml=test-results.xml

  post_build:
    commands:
      - echo "Packaging application..."
      - mkdir -p package
      - cp app.py requirements.txt package/
      - cd package
      - python -m zipfile -c ../application.zip app.py requirements.txt
      - cd ..
      - echo "Application packaging completed."

reports:
  pytest-reports:
    files:
      - test-results.xml
    file-format: JUNITXML

artifacts:
  files:
    - application.zip
    - test-results.xml
    - buildspec.yml
